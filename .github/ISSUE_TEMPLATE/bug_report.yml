name: Bug report
description: Something behaves differently from what the README says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, keys or customer data. If the input matters,
        reduce it to the smallest file that still shows the problem.

        Found a security hole? Do not use this form — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or the commit you built from
      placeholder: v1.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and runtime version
      placeholder: Windows 11, Node 22.9 / Python 3.12 / Rust 1.98
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command you ran
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
