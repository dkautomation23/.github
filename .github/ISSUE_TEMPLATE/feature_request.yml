name: Feature request
description: Ask for something the tool does not do yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Each of these tools documents what it deliberately does not do. Please
        check that section of the README first — if your request is on that
        list, the answer is already written there, with the reason.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done?
      description: The situation, not the feature. The feature may not be the answer.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: What you run now, and where it falls short
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Anything this should not break
